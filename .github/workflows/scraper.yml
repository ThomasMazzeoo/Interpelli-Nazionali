name: Motore Interpelli Nazionali

on:
  # Esegui ogni ora dal Lunedì al Venerdì, tra le 5 e le 17 UTC
  schedule:
    - cron: '0 5-17 * * 1-5'
  
  # Pulsante per avvio manuale
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installazione Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 PyPDF2

      - name: Esecuzione Scraper
        run: python orchestratore.py

      - name: Auto-Commit del Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database_nazionale.json
          git commit -m "🤖 Dati aggiornati dallo scraper" || exit 0
          git push
