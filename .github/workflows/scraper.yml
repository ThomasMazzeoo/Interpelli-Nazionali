name: Interpelli Scraper Modulare

on:
  schedule:
    - cron: '0 5-17 * * 1-5' # Dal lunedì al venerdì, dalle 5 alle 17 UTC (eseguito ogni ora)
  workflow_dispatch: # Permette l'avvio manuale dal pannello "Actions"

jobs:
  scrape_and_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installazione Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 PyPDF2

      - name: Esecuzione Orchestratore # <-- QUI E' DOVE AVVIENE LA MAGIA
        run: python main.py 

      - name: Auto-commit e Push su GitHub
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add database_nazionale.json
          
          # Se il database_nazionale.json ha subito modifiche, fa il commit. 
          # Fa un rebase per non sovrascrivere eventuali modifiche frontend fatte da te nel frattempo, e poi pusha.
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Dati aggiornati dallo scraper (Modulare)" && git pull --rebase origin main && git push)
