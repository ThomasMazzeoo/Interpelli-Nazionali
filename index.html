<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interpelli Nazionali - Mappa</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Nostro CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans overflow-hidden h-screen w-screen flex">

    <!-- COLONNA SINISTRA -->
    <aside class="w-1/3 bg-white shadow-xl z-10 flex flex-col h-screen border-r border-gray-200">
        
        <!-- Header -->
        <div class="p-5 bg-blue-900 text-white shrink-0">
            <h1 class="text-2xl font-bold tracking-tight"><i class="fa-solid fa-map-location-dot mr-2"></i> Interpelli Nazionali</h1>
            <p class="text-sm text-blue-200 mt-1">Trova la tua cattedra in Italia</p>
        </div>

        <!-- Sezione Filtri UNICA -->
        <div class="p-5 border-b border-gray-200 bg-gray-50 flex flex-col gap-3 shrink-0">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Regione</label>
                <select id="regioneSelect" class="w-full p-2 text-sm border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 shadow-sm">
                    <option value="">-- Seleziona --</option>
                    <option value="Lombardia">Lombardia</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Provincia</label>
                <select id="provinciaSelect" disabled class="w-full p-2 text-sm border border-gray-300 rounded-md bg-gray-100 disabled:opacity-50 shadow-sm">
                    <option value="">-- Prima seleziona Regione --</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Classe di Concorso</label>
                <select id="cdcSelect" class="w-full p-2 text-sm border border-gray-300 rounded-md shadow-sm">
                    <option value="">Tutte le CDC</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Grado Scuola</label>
                <select id="tipoScuolaSelect" class="w-full p-2 text-sm border border-gray-300 rounded-md shadow-sm">
                    <option value="">Tutti i gradi</option>
                    <option value="IC">Infanzia / Primaria / Medie (IC)</option>
                    <option value="SUPERIORI">Scuole Superiori (Licei, Tecnici, IIS)</option>
                </select>
            </div>
            <button id="btnResetMappa" class="w-full mt-1 bg-white border border-gray-300 text-gray-700 py-2 px-4 rounded-md hover:bg-gray-100 transition text-sm font-semibold shadow-sm">
                <i class="fa-solid fa-rotate-left mr-1"></i> Ripristina Mappa
            </button>
        </div>

        <!-- Lista Interpelli (L'area che deve scorrere) -->
        <!-- LA MAGIA E' QUI: flex-1 e min-h-0 forzano lo scorrimento -->
        <div class="flex-1 min-h-0 overflow-y-auto p-5 bg-white" id="listaInterpelli">
            <div class="text-center text-gray-400 mt-10">
                <i class="fa-solid fa-hand-pointer text-4xl mb-3"></i>
                <p>Clicca sulla mappa o usa i filtri per iniziare.</p>
            </div>
        </div>
    </aside>

    <!-- COLONNA DESTRA (Mappa) -->
    <main class="w-2/3 h-screen relative bg-blue-50" id="map-container">
        <div id="map" class="w-full h-full"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
