<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interpelli Nazionali - Stile Figma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configurazione Design System "Figma" -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        figma: {
                            black: '#000000',
                            white: '#ffffff',
                            hairline: '#e6e6e6',
                            soft: '#f7f7f5',
                            lime: '#dceeb1',
                            lilac: '#c5b0f4',
                            cream: '#f4ecd6',
                            pink: '#efd4d4',
                            mint: '#c8e6cd',
                            coral: '#f3c9b6',
                            navy: '#1f1d3d',
                            success: '#1ea64a'
                        }
                    },
                    letterSpacing: {
                        tighter: '-0.04em',
                        tight: '-0.02em',
                        widest: '0.06em'
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-figma-white text-figma-black font-sans overflow-hidden h-screen w-screen flex flex-col">

    <!-- Marquee Strip Superiore -->
    <div class="bg-figma-black text-figma-white font-mono text-[12px] tracking-widest uppercase py-2 px-6 flex justify-between items-center shrink-0">
        <span>Sistema Nazionale Interpelli</span>
        <span class="text-figma-lime"><i class="fa-solid fa-circle-check mr-2"></i>Aggiornamenti in tempo reale</span>
    </div>

    <div class="flex flex-1 overflow-hidden">
        <!-- 1. COLONNA SINISTRA -->
        <aside class="w-[30%] min-w-[340px] bg-figma-white z-20 flex flex-col h-full border-r border-figma-hairline">
            
            <!-- Header Monochrome -->
            <div class="px-8 py-8 shrink-0">
                <h1 class="text-[42px] font-[600] tracking-tighter leading-[1.1] text-figma-black mb-2">
                    Trova la tua<br>cattedra.
                </h1>
                <p class="font-sans text-[18px] font-[300] leading-[1.4] text-gray-600 tracking-tight">
                    Filtra per regione, classe di concorso e grado scolastico.
                </p>
            </div>

            <!-- Il Blocco Colore (Lime) -->
            <div class="flex-1 overflow-y-auto px-8 pb-8">
                <div class="bg-figma-lime rounded-[24px] p-8 flex flex-col gap-6">
                    
                    <div>
                        <label class="block font-mono text-[12px] uppercase tracking-widest text-figma-black mb-2">Regione</label>
                        <select id="regioneSelect" class="w-full bg-figma-white border border-figma-hairline text-figma-black text-[18px] font-[400] rounded-[8px] focus:border-figma-black focus:ring-1 focus:ring-figma-black outline-none py-3 px-4 cursor-pointer">
                            <option value="">Seleziona...</option>
                            <option value="Lombardia">Lombardia</option>
                            <option value="Piemonte">Piemonte</option>
                            <option value="Liguria">Liguria</option>
                        </select>
                    </div>

                    <div>
                        <label class="block font-mono text-[12px] uppercase tracking-widest text-figma-black mb-2">Provincia</label>
                        <select id="provinciaSelect" disabled class="w-full bg-figma-white border border-figma-hairline text-figma-black text-[18px] font-[400] rounded-[8px] focus:border-figma-black focus:ring-1 focus:ring-figma-black outline-none py-3 px-4 disabled:opacity-60 cursor-pointer">
                            <option value="">Tutte</option>
                        </select>
                    </div>

                    <div>
                        <label class="block font-mono text-[12px] uppercase tracking-widest text-figma-black mb-2">Stato Interpello</label>
                        <select id="statoSelect" class="w-full bg-figma-white border border-figma-hairline text-figma-black text-[18px] font-[400] rounded-[8px] focus:border-figma-black focus:ring-1 focus:ring-figma-black outline-none py-3 px-4 cursor-pointer">
                            <option value="TUTTI">Tutti gli Interpelli</option>
                            <option value="ATTIVI" selected>Solo Aperti</option>
                            <option value="SCADUTI">Solo Scaduti</option>
                        </select>
                    </div>
                    
                    <div class="h-[1px] bg-figma-black/10 my-2"></div>

                    <div>
                        <label class="block font-mono text-[12px] uppercase tracking-widest text-figma-black mb-2">Classe di Concorso</label>
                        <select id="cdcSelect" class="w-full bg-figma-white border border-figma-hairline text-figma-black text-[18px] font-[400] rounded-[8px] focus:border-figma-black focus:ring-1 focus:ring-figma-black outline-none py-3 px-4 cursor-pointer">
                            <option value="">Qualsiasi CDC</option>
                        </select>
                    </div>

                    <div>
                        <label class="block font-mono text-[12px] uppercase tracking-widest text-figma-black mb-2">Grado Scolastico</label>
                        <select id="tipoScuolaSelect" class="w-full bg-figma-white border border-figma-hairline text-figma-black text-[18px] font-[400] rounded-[8px] focus:border-figma-black focus:ring-1 focus:ring-figma-black outline-none py-3 px-4 cursor-pointer">
                            <option value="">Qualsiasi grado</option>
                            <option value="IC">IC (Infanzia/Primaria/Medie)</option>
                            <option value="SUPERIORI">Scuole Superiori</option>
                        </select>
                    </div>

                </div>
            </div>
        </aside>

        <!-- 2. COLONNA CENTRALE (Mappa) -->
        <main class="flex-1 h-full relative bg-figma-soft transition-all duration-300" id="map-container">
            <button id="btnResetMappa" class="absolute bottom-8 left-1/2 -translate-x-1/2 z-[1000] hidden bg-figma-black text-figma-white py-3 px-8 rounded-full hover:bg-gray-800 transition-transform active:scale-95 text-[16px] font-[500] shadow-lg cursor-pointer">
                Torna all'Italia
            </button>
            <div id="map" class="w-full h-full z-0"></div>
        </main>

        <!-- 3. COLONNA DESTRA (Risultati) -->
        <aside id="rightPanel" class="w-[35%] min-w-[400px] bg-figma-white z-20 flex flex-col h-full border-l border-figma-hairline hidden">
            <!-- Nav Header -->
            <div class="bg-figma-white border-b border-figma-hairline px-8 py-6 flex justify-between items-center shrink-0">
                <span class="font-mono text-[14px] font-bold text-figma-black uppercase tracking-widest">Risultati</span>
                <button id="chiudiPannelloBtn" class="bg-figma-soft hover:bg-figma-hairline text-figma-black rounded-full w-10 h-10 flex items-center justify-center transition cursor-pointer">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="flex-1 min-h-0 overflow-y-auto px-8 py-8" id="listaInterpelli">
            </div>
        </aside>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
