<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="d1p5DRbKeXiKSnHNShfLP-N8w_8B1-myo4CSkG-wimM" />
    
    <!-- Meta Tag SEO Base -->
    <title>Interpelli Nazionali - La mappa delle supplenze scolastiche</title>
    <meta name="description" content="Trova la tua prossima cattedra. Mappa interattiva e aggiornata in tempo reale con tutti gli interpelli scolastici d'Italia per supplenze e reclutamento docenti." />
    <meta name="keywords" content="interpelli, supplenze, scuola, docenti, MAD, classe di concorso, ministero istruzione, reclutamento docenti" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.interpellonazionale.it/" />

    <!-- Open Graph / Facebook / WhatsApp (Anteprime Social Virali) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.interpellonazionale.it/" />
    <meta property="og:title" content="Interpelli Nazionali - Trova la tua cattedra" />
    <meta property="og:description" content="Mappa interattiva aggiornata in tempo reale con tutte le posizioni aperte e i bandi di reclutamento docenti nelle scuole italiane." />
    <meta property="og:image" content="https://www.interpellonazionale.it/og-image.jpg" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Interpelli Nazionali - La mappa delle supplenze" />
    <meta name="twitter:description" content="Mappa interattiva aggiornata in tempo reale con tutti gli interpelli scolastici d'Italia." />
    <meta name="twitter:image" content="https://www.interpellonazionale.it/og-image.jpg" />

    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configurazione Design System Apple -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        apple: {
                            blue: '#0066cc',
                            blueFocus: '#0071e3',
                            parchment: '#f5f5f7',
                            pearl: '#fafafc',
                            ink: '#1d1d1f',
                            muted: '#7a7a7a',
                            hairline: '#e0e0e0',
                            black: '#000000'
                        }
                    },
                    letterSpacing: {
                        tightest: '-0.022em',
                        tighter: '-0.015em'
                    }
                }
            }
        }
    </script>
    
    <!-- Font Inter & Librerie Grafiche -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">

    <!-- DATI STRUTTURATI BASE SCHEMA.ORG (Google Organization & WebSite) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://www.interpellonazionale.it/#website",
          "url": "https://www.interpellonazionale.it/",
          "name": "Interpelli Nazionali",
          "description": "Mappa interattiva per la ricerca di supplenze e cattedre nella scuola italiana",
          "publisher": {
            "@id": "https://www.interpellonazionale.it/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://www.interpellonazionale.it/?cdc={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://www.interpellonazionale.it/#organization",
          "name": "Interpelli Nazionali",
          "url": "https://www.interpellonazionale.it/",
          "logo": "https://www.interpellonazionale.it/logo.png"
        }
      ]
    }
    </script>
</head>
<body class="bg-apple-parchment text-apple-ink font-sans overflow-hidden h-screen w-screen flex tracking-tighter">

    <!-- 1. COLONNA SINISTRA (Filtri) -->
    <aside class="w-[28%] min-w-[320px] bg-apple-parchment z-20 flex flex-col h-screen border-r border-apple-hairline">
        
        <!-- Global Nav (stile Apple) -->
        <div class="bg-apple-black text-white px-6 py-4 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="w-8 h-8 text-white">
                    <path d="M 50 95 C 50 95 15 60 15 35 A 35 35 0 0 1 85 35 C 85 60 50 95 50 95 Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
                    <polygon points="50 25, 18 38, 50 51, 82 38" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
                    <polyline points="30 43, 30 58, 50 66, 62 60" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
                    <line x1="82" y1="38" x2="82" y2="56" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    <rect x="74" y="56" width="16" height="8" rx="2" fill="#0071e3" stroke="none"/>
                </svg>
                <h1 class="text-[17px] font-semibold tracking-tightest">Interpelli Nazionali</h1>
            </div>
            <span class="text-[12px] text-gray-400 font-normal">www.interpelloNazionale.it</span>
        </div>

        <div class="px-6 py-6 pb-2 shrink-0">
            <h2 class="text-[28px] font-semibold tracking-tightest text-apple-ink leading-tight">Trova la tua<br>prossima cattedra.</h2>
        </div>

        <div class="flex-1 overflow-y-auto px-6 py-4 flex flex-col gap-6">
            
            <div class="bg-white rounded-[18px] border border-apple-hairline p-5 flex flex-col gap-4">
                <h3 class="text-[14px] font-semibold text-apple-ink tracking-tightest">Territorio & Stato</h3>
                
                <div>
                    <select id="regioneSelect" class="w-full bg-apple-pearl border border-apple-hairline text-apple-ink text-[15px] rounded-full focus:border-apple-blue focus:ring-1 focus:ring-apple-blue outline-none py-2.5 px-4 cursor-pointer transition-colors">
                        <option value="">Seleziona una Regione...</option>
                        <option value="Lombardia">Lombardia</option>
                        <option value="Piemonte">Piemonte</option>
                        <option value="Liguria">Liguria</option>
                        <option value="Veneto">Veneto</option>
                    </select>
                </div>
                <div>
                    <select id="provinciaSelect" disabled class="w-full bg-apple-pearl border border-apple-hairline text-apple-ink text-[15px] rounded-full focus:border-apple-blue focus:ring-1 focus:ring-apple-blue outline-none py-2.5 px-4 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer transition-colors">
                        <option value="">Provincia...</option>
                    </select>
                </div>
                <div>
                    <select id="statoSelect" class="w-full bg-apple-pearl border border-apple-hairline text-apple-ink text-[15px] rounded-full focus:border-apple-blue focus:ring-1 focus:ring-apple-blue outline-none py-2.5 px-4 cursor-pointer transition-colors">
                        <option value="TUTTI">Tutti gli Interpelli</option>
                        <option value="ATTIVI" selected>🟢Solo Attivi (Aperti)</option>
                        <option value="SCADUTI">🔴Solo Scaduti</option>
                    </select>
                </div>
            </div>

            <div class="bg-white rounded-[18px] border border-apple-hairline p-5 flex flex-col gap-4">
                <h3 class="text-[14px] font-semibold text-apple-ink tracking-tightest">Posizione d'Insegnamento</h3>
                
                <div>
                    <select id="cdcSelect" class="w-full bg-apple-pearl border border-apple-hairline text-apple-ink text-[15px] rounded-full focus:border-apple-blue focus:ring-1 focus:ring-apple-blue outline-none py-2.5 px-4 cursor-pointer transition-colors">
                        <option value="">Tutte le Classi di Concorso</option>
                    </select>
                </div>
                <div>
                    <select id="tipoScuolaSelect" class="w-full bg-apple-pearl border border-apple-hairline text-apple-ink text-[15px] rounded-full focus:border-apple-blue focus:ring-1 focus:ring-apple-blue outline-none py-2.5 px-4 cursor-pointer transition-colors">
                        <option value="">Tutti i gradi scolastici</option>
                        <option value="IC">Infanzia / Primaria / Medie (IC)</option>
                        <option value="SUPERIORI">Scuole Superiori</option>
                    </select>
                </div>
            </div>
        </div>
    </aside>

    <!-- 2. COLONNA CENTRALE (Mappa) -->
    <main class="flex-1 h-screen relative bg-apple-parchment transition-all duration-300" id="map-container">
        <button id="btnResetMappa" class="absolute bottom-10 left-1/2 -translate-x-1/2 z-[1000] hidden bg-[#f5f5f7]/80 backdrop-blur-md border border-apple-hairline text-apple-ink py-2.5 px-5 rounded-full hover:bg-white transition-all text-[14px] font-semibold shadow-sm flex items-center justify-center gap-2 cursor-pointer active:scale-95">
            <i class="fa-solid fa-rotate-left"></i> Resetta Mappa
        </button>

        <div id="map" class="w-full h-full z-0"></div>
    </main>

    <!-- 3. COLONNA DESTRA (Risultati o Dashboard) -->
    <aside id="rightPanel" class="w-[34%] min-w-[380px] bg-apple-parchment z-20 flex flex-col h-screen border-l border-apple-hairline hidden">
        <div class="bg-[#f5f5f7]/80 backdrop-blur-xl border-b border-apple-hairline px-6 py-4 flex justify-between items-center shrink-0 z-10 sticky top-0">
            <span id="rightPanelTitle" class="text-[21px] font-semibold text-apple-ink tracking-tightest">Risultati</span>
            <button id="chiudiPannelloBtn" class="bg-apple-pearl border border-apple-hairline text-apple-ink rounded-full w-8 h-8 flex items-center justify-center transition active:scale-95 cursor-pointer hover:bg-red-50 hover:text-red-500">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        
        <div class="flex-1 min-h-0 overflow-y-auto px-6 py-6 relative" id="listaInterpelli">
        </div>
    </aside>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
