<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interpelli Nazionali - La mappa delle supplenze</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* Tipografia rigorosa del Design System */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
            color: #333840; /* Body text */
            -webkit-font-smoothing: antialiased;
        }
        
        /* Nasconde i crediti di Leaflet per mantenere la mappa pulita */
        .leaflet-control-attribution { display: none !important; }
        
        /* Stile Scrollbar minimale */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #dddddd; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #9297a0; }
    </style>
</head>
<body class="bg-[#ffffff] overflow-hidden h-screen w-screen flex">

    <!-- 1. COLONNA SINISTRA (Filtri Editoriali) -->
    <aside class="w-[28%] min-w-[340px] bg-[#ffffff] z-20 flex flex-col h-screen border-r border-[#dddddd]">
        
        <!-- Hero Band (White Canvas) -->
        <div class="px-8 py-10 shrink-0 border-b border-[#dddddd]">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-10 h-10 rounded-full bg-[#181d26] flex items-center justify-center text-[#ffffff]">
                    <i class="fa-solid fa-layer-group text-lg"></i>
                </div>
                <h1 class="text-[32px] font-normal text-[#181d26] tracking-tight leading-[1.2]">Interpelli</h1>
            </div>
            <p class="text-[14px] font-normal text-[#41454d] mt-1">La mappa nazionale delle supplenze.</p>
        </div>

        <!-- Area Filtri (Flat Design) -->
        <div class="flex-1 overflow-y-auto px-8 py-8 flex flex-col gap-8">
            
            <div class="flex flex-col gap-5">
                <h2 class="text-[16px] font-medium text-[#181d26]">Territorio e Stato</h2>
                
                <div>
                    <label class="block text-[14px] font-medium text-[#181d26] mb-2">Regione</label>
                    <select id="regioneSelect" class="w-full bg-[#ffffff] border border-[#dddddd] text-[#333840] text-[14px] rounded-[6px] h-[44px] px-3 focus:outline-none focus:border-[#458fff] focus:ring-1 focus:ring-[#458fff] cursor-pointer">
                        <option value="">Seleziona una regione</option>
                        <option value="Lombardia">Lombardia</option>
                        <option value="Piemonte">Piemonte</option>
                        <option value="Liguria">Liguria</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[14px] font-medium text-[#181d26] mb-2">Provincia</label>
                    <select id="provinciaSelect" disabled class="w-full bg-[#ffffff] border border-[#dddddd] text-[#333840] text-[14px] rounded-[6px] h-[44px] px-3 focus:outline-none focus:border-[#458fff] focus:ring-1 focus:ring-[#458fff] disabled:opacity-50 disabled:bg-[#f8fafc] cursor-pointer">
                        <option value="">Scegli prima la regione</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[14px] font-medium text-[#181d26] mb-2">Stato Interpello</label>
                    <select id="statoSelect" class="w-full bg-[#ffffff] border border-[#dddddd] text-[#333840] text-[14px] rounded-[6px] h-[44px] px-3 focus:outline-none focus:border-[#458fff] focus:ring-1 focus:ring-[#458fff] cursor-pointer">
                        <option value="TUTTI">Tutti (Attivi e Chiusi)</option>
                        <option value="ATTIVI" selected>Solo Attivi (Aperti)</option>
                        <option value="SCADUTI">Solo Scaduti</option>
                    </select>
                </div>
            </div>

            <div class="w-full h-px bg-[#dddddd]"></div> <!-- Hairline divider -->

            <div class="flex flex-col gap-5">
                <h2 class="text-[16px] font-medium text-[#181d26]">Posizione</h2>
                
                <div>
                    <label class="block text-[14px] font-medium text-[#181d26] mb-2">Classe di Concorso</label>
                    <select id="cdcSelect" class="w-full bg-[#ffffff] border border-[#dddddd] text-[#333840] text-[14px] rounded-[6px] h-[44px] px-3 focus:outline-none focus:border-[#458fff] focus:ring-1 focus:ring-[#458fff] cursor-pointer">
                        <option value="">Tutte le classi</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[14px] font-medium text-[#181d26] mb-2">Grado Scuola</label>
                    <select id="tipoScuolaSelect" class="w-full bg-[#ffffff] border border-[#dddddd] text-[#333840] text-[14px] rounded-[6px] h-[44px] px-3 focus:outline-none focus:border-[#458fff] focus:ring-1 focus:ring-[#458fff] cursor-pointer">
                        <option value="">Tutti i gradi</option>
                        <option value="IC">Infanzia / Primaria / Medie (IC)</option>
                        <option value="SUPERIORI">Scuole Superiori (Licei, Tecnici)</option>
                    </select>
                </div>
            </div>
            
        </div>
    </aside>

    <!-- 2. COLONNA CENTRALE (Mappa) -->
    <main class="flex-1 h-screen relative bg-[#f8fafc]" id="map-container">
        <!-- Secondary Button Style -->
        <button id="btnResetMappa" class="absolute top-8 right-8 z-[1000] hidden bg-[#ffffff] border border-[#dddddd] text-[#181d26] px-6 h-[44px] rounded-[12px] hover:bg-[#f8fafc] transition-colors text-[14px] font-medium flex items-center justify-center gap-2 cursor-pointer shadow-none">
            <i class="fa-solid fa-earth-europe text-[#41454d]"></i> Torna all'Italia
        </button>

        <div id="map" class="w-full h-full z-0"></div>
    </main>

    <!-- 3. COLONNA DESTRA (Risultati Editoriali) -->
    <aside id="rightPanel" class="w-[32%] min-w-[380px] bg-[#f8fafc] z-20 flex flex-col h-screen border-l border-[#dddddd] hidden">
        
        <div class="bg-[#ffffff] border-b border-[#dddddd] px-8 py-8 flex justify-between items-center shrink-0">
            <h2 class="text-[24px] font-normal text-[#181d26] tracking-tight">Risultati</h2>
            
            <!-- Icon Circular Button -->
            <button id="chiudiPannelloBtn" class="w-10 h-10 rounded-full bg-[#ffffff] border border-[#dddddd] text-[#181d26] hover:bg-[#f8fafc] flex items-center justify-center transition cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        
        <div class="flex-1 min-h-0 overflow-y-auto px-6 py-8 relative" id="listaInterpelli">
        </div>
    </aside>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
