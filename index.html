<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interpelli Nazionali - Mappa</title>
    <!-- Tailwind CSS per il Layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome per le icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS per la Mappa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Nostro CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans overflow-hidden h-screen flex">

    <!-- COLONNA SINISTRA: Controlli e Risultati (1/3 dello schermo) -->
    <aside class="w-1/3 bg-white shadow-xl z-10 flex flex-col h-full border-r border-gray-200">
        
        <!-- Header -->
        <div class="p-6 bg-blue-900 text-white">
            <h1 class="text-2xl font-bold tracking-tight"><i class="fa-solid fa-map-location-dot mr-2"></i> Interpelli Nazionali</h1>
            <p class="text-sm text-blue-200 mt-1">Trova la tua cattedra in Italia</p>
        </div>

        <!-- Sezione Filtri -->
        <div class="p-6 border-b border-gray-100 bg-gray-50 flex flex-col gap-4 shrink-0">
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Regione</label>
                <select id="regioneSelect" class="w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 shadow-sm">
                    <option value="">-- Seleziona una Regione --</option>
                    <option value="Lombardia">Lombardia</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Provincia</label>
                <select id="provinciaSelect" disabled class="w-full p-2 border border-gray-300 rounded-md bg-gray-100 focus:ring-blue-500 focus:border-blue-500 disabled:opacity-50 shadow-sm">
                    <option value="">-- Prima seleziona una Regione --</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Classe di Concorso</label>
                <select id="cdcSelect" class="w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 shadow-sm">
                    <option value="">Tutte le CDC</option>
                    <!-- Popolato in automatico dal JS -->
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Grado Scuola</label>
                <select id="tipoScuolaSelect" class="w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 shadow-sm">
                    <option value="">Tutti i gradi</option>
                    <option value="IC">Infanzia / Primaria / Medie (IC)</option>
                    <option value="SUPERIORI">Scuole Superiori (Licei, Tecnici, IIS)</option>
                </select>
            </div>

            <button id="btnResetMappa" class="w-full mt-2 bg-white border border-gray-300 text-gray-700 py-2 px-4 rounded-md hover:bg-gray-100 transition text-sm font-semibold shadow-sm">
                <i class="fa-solid fa-rotate-left mr-1"></i> Ripristina Mappa Italia
            </button>
        </div>

        <!-- Lista Interpelli Trovati (Scrollabile) -->
        <div class="flex-1 overflow-y-auto p-6" id="listaInterpelli">
            <div class="text-center text-gray-400 mt-10">
                <i class="fa-solid fa-hand-pointer text-4xl mb-3"></i>
                <p>Clicca sulla mappa o usa i filtri per vedere gli interpelli.</p>
            </div>
        </div>
    </aside>

    <!-- COLONNA DESTRA: La Mappa Interattiva (2/3 dello schermo) -->
    <main class="w-2/3 h-full relative bg-blue-50" id="map-container">
        <!-- Il div dove Leaflet disegnerà l'Italia -->
        <div id="map" class="w-full h-full"></div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Nostro App JS -->
    <script src="app.js"></script>
</body>
</html>
