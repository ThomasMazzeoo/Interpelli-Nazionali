<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interpelli Nazionali - La mappa delle supplenze</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans overflow-hidden h-screen w-screen flex">

    <!-- 1. COLONNA SINISTRA (Solo Filtri) -->
    <aside class="w-[28%] min-w-[320px] bg-white shadow-[4px_0_24px_rgba(0,0,0,0.1)] z-20 flex flex-col h-screen border-r border-gray-200">
        
        <div class="relative bg-gradient-to-br from-[#0f2a5a] to-[#1e40af] text-white p-6 shrink-0 border-t-4 border-t-green-500">
            <div class="absolute top-0 left-1/3 w-1/3 h-1 bg-white"></div>
            <div class="absolute top-0 right-0 w-1/3 h-1 bg-red-500"></div>
            <div class="flex items-center gap-3">
                <div class="bg-white/10 p-2 rounded-lg backdrop-blur-sm border border-white/20">
                    <i class="fa-solid fa-map-location-dot text-2xl text-blue-100"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight leading-none text-white shadow-sm">Interpelli Nazionali</h1>
                    <p class="text-xs text-blue-200 mt-1 font-medium tracking-wide uppercase"><i class="fa-solid fa-bolt text-yellow-400 mr-1"></i> Aggiornamenti in tempo reale</p>
                </div>
            </div>
        </div>

        <div class="bg-slate-100 border-b border-gray-200 px-6 py-3 flex justify-between items-center shrink-0">
            <span class="text-sm font-bold text-gray-600 uppercase tracking-wider"><i class="fa-solid fa-sliders mr-2"></i> Filtri di Ricerca</span>
        </div>

        <div class="flex-1 overflow-y-auto bg-slate-50 p-6 flex flex-col gap-5">
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex flex-col gap-4 relative">
                <span class="absolute -top-3 left-4 bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider border border-blue-200">Territorio & Stato</span>
                <div>
                    <label class="flex items-center text-sm font-semibold text-gray-700 mb-1.5"><i class="fa-solid fa-map text-blue-600 w-5"></i> Regione</label>
                    <select id="regioneSelect" class="w-full bg-slate-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none cursor-pointer">
                        <option value="">-- Clicca sulla mappa o scegli --</option>
                        <option value="Lombardia">Lombardia</option>
                        <option value="Piemonte">Piemonte</option>
                        <option value="Liguria">Liguria</option>
                    </select>
                </div>
                <div>
                    <label class="flex items-center text-sm font-semibold text-gray-700 mb-1.5"><i class="fa-solid fa-location-dot text-red-500 w-5"></i> Provincia</label>
                    <select id="provinciaSelect" disabled class="w-full bg-slate-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
                        <option value="">-- Seleziona prima la Regione --</option>
                    </select>
                </div>
                <div>
                    <label class="flex items-center text-sm font-semibold text-gray-700 mb-1.5"><i class="fa-solid fa-filter text-blue-600 w-5"></i> Stato Interpello</label>
                    <select id="statoSelect" class="w-full bg-slate-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none cursor-pointer">
                        <option value="TUTTI">🔵 Tutti (Attivi e Chiusi)</option>
                        <option value="ATTIVI" selected>🟢 Solo Attivi (Aperti)</option>
                        <option value="SCADUTI">🔴 Solo Scaduti / Chiusi</option>
                    </select>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex flex-col gap-4 relative mt-2">
                <span class="absolute -top-3 left-4 bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider border border-emerald-200">Posizione</span>
                <div>
                    <label class="flex items-center text-sm font-semibold text-gray-700 mb-1.5"><i class="fa-solid fa-chalkboard-user text-emerald-600 w-5"></i> Classe di Concorso</label>
                    <select id="cdcSelect" class="w-full bg-slate-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 block p-2.5 outline-none cursor-pointer">
                        <option value="">Tutte le Classi (Vedi Tutto)</option>
                    </select>
                </div>
                <div>
                    <label class="flex items-center text-sm font-semibold text-gray-700 mb-1.5"><i class="fa-solid fa-school text-emerald-600 w-5"></i> Grado Scuola</label>
                    <select id="tipoScuolaSelect" class="w-full bg-slate-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 block p-2.5 outline-none cursor-pointer">
                        <option value="">Tutti i gradi</option>
                        <option value="IC">Infanzia / Primaria / Medie (IC)</option>
                        <option value="SUPERIORI">Scuole Superiori (Licei, Tecnici, IIS)</option>
                    </select>
                </div>
            </div>
            
            <div class="mt-auto text-center p-4">
                <i class="fa-solid fa-satellite-dish text-4xl text-blue-200 mb-2 opacity-50"></i>
                <p class="text-xs text-gray-400 font-medium">Seleziona i filtri per cercare</p>
            </div>
        </div>
    </aside>

    <!-- 2. COLONNA CENTRALE (Mappa) -->
    <main class="flex-1 h-screen relative bg-[#e2e8f0] transition-all duration-300" id="map-container">
        <button id="btnResetMappa" class="absolute top-6 right-6 z-[1000] hidden bg-white border border-slate-200 text-slate-800 py-3 px-6 rounded-full hover:bg-slate-50 hover:text-blue-700 hover:border-blue-400 hover:shadow-xl transition-all text-sm font-extrabold shadow-lg flex items-center justify-center gap-2 cursor-pointer">
            <i class="fa-solid fa-earth-europe text-blue-600 text-lg"></i> Torna all'Italia intera
        </button>

        <div id="map" class="w-full h-full z-0"></div>
    </main>

    <!-- 3. COLONNA DESTRA (Risultati - Si apre dinamicamente) -->
    <aside id="rightPanel" class="w-[32%] min-w-[350px] bg-white shadow-[-8px_0_24px_rgba(0,0,0,0.05)] z-20 flex flex-col h-screen border-l border-gray-200 hidden">
        <div class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shrink-0">
            <span class="text-sm font-bold text-gray-800 uppercase tracking-wider flex items-center"><i class="fa-solid fa-list-check text-blue-600 mr-2 text-lg"></i> Risultati Trovati</span>
            <button id="chiudiPannelloBtn" class="text-gray-400 hover:text-red-500 bg-gray-50 hover:bg-red-50 rounded-full w-8 h-8 flex items-center justify-center transition cursor-pointer">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        
        <!-- Qui dentro verranno caricate le card dal Javascript -->
        <div class="flex-1 min-h-0 overflow-y-auto p-5 bg-[#f8fafc] relative" id="listaInterpelli">
        </div>
    </aside>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
