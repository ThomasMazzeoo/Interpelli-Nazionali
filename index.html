<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interpelli Nazionali - La mappa delle supplenze</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Nostro CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans overflow-hidden h-screen w-screen flex">

    <!-- COLONNA SINISTRA -->
    <aside class="w-1/3 bg-white shadow-[4px_0_24px_rgba(0,0,0,0.1)] z-10 flex flex-col h-screen border-r border-gray-200">
        
        <!-- Header Istituzionale (Con mini-tricolore in alto) -->
        <div class="relative bg-gradient-to-br from-[#0f2a5a] to-[#1e40af] text-white p-6 shrink-0 border-t-4 border-t-green-500">
            <!-- Strisce tricolore (rosso e bianco, il verde è il border-t) -->
            <div class="absolute top-0 left-1/3 w-1/3 h-1 bg-white"></div>
            <div class="absolute top-0 right-0 w-1/3 h-1 bg-red-500"></div>
            
            <div class="flex items-center gap-3">
                <div class="bg-white/10 p-2 rounded-lg backdrop-blur-sm border border-white/20">
                    <i class="fa-solid fa-map-location-dot text-2xl text-blue-100"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight leading-none text-white shadow-sm">Interpelli Nazionali</h1>
                    <p class="text-xs text-blue-200 mt-1 font-medium tracking-wide uppercase"><i class="fa-solid fa-bolt text-yellow-400 mr-1"></i> Aggiornamenti in tempo reale</p>
                </div>
            </div>
        </div>

        <!-- Sezione Filtri Moderna -->
        <div class="p-6 border-b border-gray-100 bg-slate-50 flex flex-col gap-5 shrink-0 shadow-inner">
            
            <!-- Box Regione & Provincia -->
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex flex-col gap-4 relative">
                <span class="absolute -top-3 left-4 bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider border border-blue-200">Territorio</span>
                
                <div>
                    <label class="flex items-center text-sm font-semibold text-gray-700 mb-1.5">
                        <i class="fa-solid fa-map text-blue-600 w-5"></i> Regione
                    </label>
                    <select id="regioneSelect" class="w-full bg-slate-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-2.5 transition-all hover:border-blue-400 cursor-pointer outline-none">
                        <option value="">-- Clicca sulla mappa o scegli --</option>
                        <option value="Lombardia">Lombardia</option>
                    </select>
                </div>

                <div>
                    <label class="flex items-center text-sm font-semibold text-gray-700 mb-1.5">
                        <i class="fa-solid fa-location-dot text-red-500 w-5"></i> Provincia
                    </label>
                    <select id="provinciaSelect" disabled class="w-full bg-slate-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-2.5 transition-all disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer outline-none">
                        <option value="">-- Seleziona prima la Regione --</option>
                    </select>
                </div>
            </div>

            <!-- Box Cattedra -->
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex flex-col gap-4 relative mt-2">
                <span class="absolute -top-3 left-4 bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider border border-emerald-200">Posizione</span>

                <div>
                    <label class="flex items-center text-sm font-semibold text-gray-700 mb-1.5">
                        <i class="fa-solid fa-chalkboard-user text-emerald-600 w-5"></i> Classe di Concorso
                    </label>
                    <select id="cdcSelect" class="w-full bg-slate-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 block p-2.5 transition-all hover:border-emerald-400 cursor-pointer outline-none">
                        <option value="">Tutte le Classi (Vedi Tutto)</option>
                    </select>
                </div>

                <div>
                    <label class="flex items-center text-sm font-semibold text-gray-700 mb-1.5">
                        <i class="fa-solid fa-school text-emerald-600 w-5"></i> Grado Scuola
                    </label>
                    <select id="tipoScuolaSelect" class="w-full bg-slate-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 block p-2.5 transition-all hover:border-emerald-400 cursor-pointer outline-none">
                        <option value="">Tutti i gradi</option>
                        <option value="IC">Infanzia / Primaria / Medie (IC)</option>
                        <option value="SUPERIORI">Scuole Superiori (Licei, Tecnici, IIS)</option>
                    </select>
                </div>
            </div>

            <!-- Bottone Reset -->
            <button id="btnResetMappa" class="w-full mt-1 bg-white border border-slate-300 text-slate-600 py-2 px-4 rounded-lg hover:bg-slate-100 hover:text-slate-800 transition-all text-sm font-semibold shadow-sm flex items-center justify-center gap-2 group">
                <i class="fa-solid fa-arrows-rotate group-hover:-rotate-180 transition-transform duration-500"></i> Ripristina Mappa Italia
            </button>
        </div>

        <!-- Lista Interpelli (Empty State Migliorato) -->
        <div class="flex-1 min-h-0 overflow-y-auto p-5 bg-white relative" id="listaInterpelli">
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 bg-gradient-to-b from-transparent to-slate-50/50">
                <div class="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center mb-4 border-4 border-white shadow-lg">
                    <i class="fa-solid fa-satellite-dish text-3xl text-blue-500 animate-pulse"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-800 mb-1">In attesa di istruzioni</h3>
                <p class="text-sm text-gray-500">Scegli una regione sulla mappa o usa i filtri in alto per cercare gli interpelli disponibili.</p>
            </div>
        </div>
    </aside>

    <!-- COLONNA DESTRA (Mappa) -->
    <main class="w-2/3 h-screen relative bg-[#e2e8f0]" id="map-container">
        <div id="map" class="w-full h-full"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
